services:
  harbor:
    build: .
    image: harbor:local
    ports:
      - "${HARBOR_PORT:-7750}:7750"
    environment:
      HARBOR_ADMIN_PASSWORD: "${HARBOR_ADMIN_PASSWORD:-}"
    volumes:
      - harbor-data:/data
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  harbor-data:
